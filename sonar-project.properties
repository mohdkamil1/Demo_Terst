# ---------------------------------------------------------------------------
# SonarQube Cloud project configuration
# ---------------------------------------------------------------------------

# Identity — VERIFY these two against your SonarCloud project page
# (Project -> Information). SonarCloud's usual convention for a personal
# GitHub account is  <github-username>_<repo-name>.
sonar.projectKey=mohdkamil1_Demo_Terst
sonar.organization=mohdkamil1
sonar.projectName=Demo_Terst

# What to analyse
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Keep vendored / generated code out of the analysis
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/*.min.js

# --- Optional: test-coverage import (uncomment + point at your report) ------
# sonar.javascript.lcov.reportPaths=coverage/lcov.info